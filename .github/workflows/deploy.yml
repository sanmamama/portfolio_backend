name: Deploy Django to VPS

on:
  push:
    branches:
      - main  # mainブランチにプッシュされたときにトリガー

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: チェックアウト
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Create credential file
      run: |
        sudo echo "${{ secrets.API_SECRETS_FILE }}" > api/secrets.py
        sudo echo "${{ secrets.REST_SECRETS_FILE }}" > rest/secrets.py

    - name: Build Docker image
      run: |
        docker build -t backend:latest .

    - name: Save Docker image as tarball
      run: |
        docker save backend:latest | gzip > backend.tar.gz

    - name: サーバーにファイルをアップロード
      uses: appleboy/scp-action@v0.1.3
      with:
        host: 118.27.2.129
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        source: "api/*,rest/urls.py"
        target: "/root/rest"

    - name: サーバにdockerimageをアップロード
      uses: appleboy/scp-action@v0.1.3
      with:
        host: 118.27.2.129
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        source: "backend.tar.gz"
        target: "/root/portfolio"

    - name: サーバーでコマンドを実行
      uses: appleboy/ssh-action@v0.1.2
      with:
        host: 118.27.2.129
        username: root
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        port: 22
        script: |
          source /root/rest/venv/bin/activate
          cd rest
          python manage.py makemigrations
          python manage.py migrate
          python manage.py collectstatic --noinput
          sudo systemctl restart gunicorn

